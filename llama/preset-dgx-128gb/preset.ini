# uses:
# - llama.cpp webui
# - llama.vim
# - pi
#
# target machines:
# - 2x NVIDIA DGX Spark (RDMA, TP=2)

[*]
ctx-size             = 0
kv-unified           = 1
parallel             = 4
#spec-default         = 1
reasoning-preserve   = 1
backend-sampling     = 1
spec-draft-sampling  = probabilistic

[mimo-v2.6-flash-mopd]
hf                   = ggml-org/MiMo-V2.6-Flash-MOPD-GGUF:MXFP4
spec-type            = draft-dflash
spec-draft-n-max     = 5
spec-draft-p-min     = 0.7
ctx-size             = 262144
parallel             = 1
batch-size           = 8192
ubatch-size          = 2048
temp                 = 1.0
top-p                = 0.95
top-k                = 0
rpc                  = 192.168.100.2:50052,192.168.100.1:50052
device               = RPC0,RPC1
split-mode           = tensor
load-mode            = dio
alias                = agent-mimo

[glm5.3-flash]
hf                   = ggml-org/GLM-5.3-Flash-GGUF:Q4_K
spec-type            = draft-mtp
spec-draft-n-max     = 3
ctx-size             = 262144
parallel             = 1
batch-size           = 8192
ubatch-size          = 2048
temp                 = 1.0
top-p                = 0.95
top-k                = 0
rpc                  = 192.168.100.2:50052,192.168.100.1:50052
device               = RPC0,RPC1
split-mode           = tensor
load-mode            = dio
alias                = agent-glm

[deepseek-v4.1-flash-1017]
hf                   = ggml-org/DeepSeek-V4.1-Flash-1017-GGUF:Q2_K
spec-type            = draft-dspark
spec-draft-n-max     = 5
spec-draft-hf        = ggml-org/DeepSeek-V4.1-Flash-1017-GGUF
spec-draft-model     = dspark-DeepSeek-V4.1-Flash-1017-MXFP4.gguf
kv-unified           = 0
parallel             = 1
ctx-size             = 524288
batch-size           = 4096
ubatch-size          = 512
temp                 = 1.0
top-p                = 1.0
top-k                = 0
rpc                  = 192.168.100.2:50052,192.168.100.1:50052
device               = RPC0,RPC1
split-mode           = tensor
load-mode            = dio
alias                = agent-dsv41

[deepseek-v4.1-flash-1017-s]
hf                   = ggml-org/DeepSeek-V4.1-Flash-1017-GGUF:Q2_K_S
spec-type            = draft-dspark
spec-draft-n-max     = 5
spec-draft-hf        = ggml-org/DeepSeek-V4.1-Flash-1017-GGUF
spec-draft-model     = dspark-DeepSeek-V4.1-Flash-1017-MXFP4.gguf
kv-unified           = 0
parallel             = 2
ctx-size             = 1048576
batch-size           = 4096
ubatch-size          = 1024
temp                 = 1.0
top-p                = 1.0
top-k                = 0
rpc                  = 192.168.100.2:50052,192.168.100.1:50052
device               = RPC0,RPC1
split-mode           = tensor
load-mode            = dio
alias                = agent-dsv41-s
