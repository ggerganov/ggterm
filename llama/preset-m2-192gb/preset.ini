# uses:
# - llama.cpp webui
# - llama.vim
# - opencode
# - pi
#
# target machines:
# - M2 Ultra 192GB
# - NVIDIA DGX Spark

[*]
ctx-size             = 0
kv-unified           = 1
parallel             = 4
spec-default         = 1
reasoning-preserve   = 1
backend-sampling     = 1
spec-draft-sampling  = probabilistic

