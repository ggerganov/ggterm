! kiss-client.conf: the page of every KiSS server of the fleet.
!
! The page reads this file as client.conf of the directory its server runs in,
! which the server serves to it as it is. A look of the page is no key of the
! server: it has no style module, so a set style in a server.conf reads as an
! unknown key, is skipped, and is named in the log. Hence a second file beside
! the first, for a fleet that styles its pages.

! the page attaches to the server it came from and takes the tools of the
! machine from it: the line the embedded client.conf holds, kept here as it is
set mcp url backend mcp

! three tokens make every text of the page: the chat, what stands around it, and
! its title. None is read smaller than 0.625rem, so 60% of a default of 1rem or
! of 0.8rem both land on that floor: 62.5% is as small as this page will go, and
! the chat and its surroundings end up the same size.
set style size-primary 0.625rem
set style size-secondary 0.625rem
set style size-title 0.9rem
