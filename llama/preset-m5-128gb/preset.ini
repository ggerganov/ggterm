# targets M5 machines with 128GB+ VRAM

[*]
ctx-size             = 0
kv-unified           = 1
spec-default         = 1

[qwen3.8-flash-next]
hf                   = ggml-org/Qwen3.8-Flash-Next-GGUF:IQ4_NL
spec-default         = 1
spec-type            = draft-mtp
spec-draft-n-max     = 3
spec-draft-hf        = ggml-org/Qwen3.8-Flash-Next-GGUF
spec-draft-model     = mtp-Qwen3.8-Flash-Next-Q4_0.gguf
ctx-size             = 524288
parallel             = 2
cache-type-k         = bf16
cache-type-v         = bf16
batch-size           = 8192
ubatch-size          = 2048
spec-draft-n-ubatch  = 2048
alias                = qwen3.8-flash-next,agent-qwen4
load-mode            = mmap
lazy-mode            = auto
