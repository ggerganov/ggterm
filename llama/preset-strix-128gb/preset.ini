# uses:
# - llama.cpp webui
# - llama.vim
# - pi
#
# target machines:
# - 2x AMD Strix Halo, 128GB (RPC)

[*]
ctx-size             = 0
kv-unified           = 1
parallel             = 4
spec-default         = 1
reasoning-preserve   = 1
spec-draft-sampling  = probabilistic

[mimo-v2.6-flash-mopd]
hf                   = ggml-org/MiMo-V2.6-Flash-MOPD-GGUF:MXFP4
spec-default         = 1
spec-type            = draft-mtp
ctx-size             = 262144
parallel             = 1
batch-size           = 16384
ubatch-size          = 512
temp                 = 1.0
top-p                = 0.95
top-k                = 0
rpc                  = 192.168.100.1:50052,192.168.100.2:50052
device               = RPC0,RPC1
load-mode            = dio
alias                = agent-mimo
