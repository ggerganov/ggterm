! kiss.conf: the fleet this machine answers to.
!
! An endpoint for the llama.cpp server of every machine that runs one, and an
! MCP server for the ggmcp of every machine that runs one. kiss-start copies
! this file to the server.conf of the directory it runs from, and the page of
! that server lists every model of every endpoint below and feeds the tools of
! every MCP server below to the one model the chat names.
!
! The names of the MCP servers end in -mcp: an MCP server may not borrow the
! name of an endpoint, since a model is named <endpoint>/<model>.

! the llama.cpp server of each machine: its models, its context and its max
! tokens are the ones its preset answers on /v1/models
set endpoints url m2      http://100.109.206.95:9932/v1
set endpoints url m5-0    http://100.109.1.92:9932/v1
set endpoints url m5-1    http://100.82.237.74:9932/v1
set endpoints url dgx-0   http://100.64.225.101:9932/v1
set endpoints url rtx     http://100.111.34.101:9932/v1
set endpoints url strix-0 http://100.112.93.68:9932/v1

! when a conversation folds, and what a fold keeps: three quarters of the
! context each model answers on, and the three last steps of the turn. A model
! with no trigger never folds; a fold that keeps no step forgets the tools it
! ran. The models and their contexts are the ones ~/.pi/agent/models.json names
! for the providers of these endpoints, and a model added there wants the two
! lines of its own here.

! m2: 5 models, 256k of context
set models compaction-trigger-tokens m2/agent-qwen3.8 196608
set models compaction-preserve-steps m2/agent-qwen3.8 3
set models compaction-trigger-tokens m2/agent-dsv4 196608
set models compaction-preserve-steps m2/agent-dsv4 3
set models compaction-trigger-tokens m2/agent-mimo 196608
set models compaction-preserve-steps m2/agent-mimo 3
set models compaction-trigger-tokens m2/agent-qwen4 196608
set models compaction-preserve-steps m2/agent-qwen4 3
set models compaction-trigger-tokens m2/agent-glm 196608
set models compaction-preserve-steps m2/agent-glm 3

! m5-1: 1 model, 256k of context
set models compaction-trigger-tokens m5-1/agent-qwen4 196608
set models compaction-preserve-steps m5-1/agent-qwen4 3

! dgx-0: 2 models, 256k of context
set models compaction-trigger-tokens dgx-0/agent-mimo 196608
set models compaction-preserve-steps dgx-0/agent-mimo 3
set models compaction-trigger-tokens dgx-0/agent-glm 196608
set models compaction-preserve-steps dgx-0/agent-glm 3

! rtx: 5 models, four of 128k and one of 256k
set models compaction-trigger-tokens rtx/agent-dsv4 98304
set models compaction-preserve-steps rtx/agent-dsv4 3
set models compaction-trigger-tokens rtx/agent-qwen3.8 98304
set models compaction-preserve-steps rtx/agent-qwen3.8 3
set models compaction-trigger-tokens rtx/agent-qwen4 98304
set models compaction-preserve-steps rtx/agent-qwen4 3
set models compaction-trigger-tokens rtx/agent-glm 98304
set models compaction-preserve-steps rtx/agent-glm 3
set models compaction-trigger-tokens rtx/agent-flint 196608
set models compaction-preserve-steps rtx/agent-flint 3

! strix-0: 1 model, 256k of context
set models compaction-trigger-tokens strix-0/agent-mimo 196608
set models compaction-preserve-steps strix-0/agent-mimo 3

! the ggmcp server of each machine, the same machines and one more: dgx-1 and
! strix-1 keep no llama.cpp server of their own, they answer to their RPC peer
set mcp url m2-mcp      http://100.109.206.95:9933/mcp
set mcp url m5-0-mcp    http://100.109.1.92:9933/mcp
set mcp url m5-1-mcp    http://100.82.237.74:9933/mcp
set mcp url dgx-0-mcp   http://100.64.225.101:9933/mcp
set mcp url dgx-1-mcp   http://100.69.125.93:9933/mcp
set mcp url rtx-mcp     http://100.111.34.101:9933/mcp
set mcp url strix-0-mcp http://100.112.93.68:9933/mcp
set mcp url strix-1-mcp http://100.77.67.107:9933/mcp

! the address the servers of the fleet listen on: the page of a machine is
! reached from the tailnet, so every address of the machine; kiss-start then
! makes the key the page asks for, and writes it here alone
set server listen-address 0.0.0.0
