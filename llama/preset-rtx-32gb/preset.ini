[qwen3.8-27b-hf-think]
hf                   = ggml-org/Qwen3.8-27B-GGUF:Q4_K_M
spec-type            = draft-dflash
spec-draft-n-max     = 7
spec-draft-hf        = ggml-org/Qwen3.8-27B-GGUF
spec-draft-model     = dflash-Qwen3.8-27B-Q4_0.gguf
ctx-size             = 131072
cache-type-k         = q8_0
cache-type-v         = q8_0
batch-size           = 2048
ubatch-size          = 512
alias                = qwen3.8-27b-hf-think,pi,webui,agent-qwen3.8
reasoning-budget     = 4096
reasoning-budget-message = ... I am thinking for too long -- let me gather more info about the task.
chat-template-kwargs = {"reasoning_effort": "medium"}

[deepseek-v4-flash-vision-exp]
hf                   = ggml-org/DeepSeek-V4-Flash-Vision-Exp-GGUF:Q2_K_S
spec-default         = 0
#spec-type            = draft-mtp
#spec-draft-n-max     = 3
#spec-draft-hf        = ggml-org/GLM-5.3-Flash-GGUF
#spec-draft-model     = mtp-GLM-5.3-Flash-Q4_0.gguf
ctx-size             = 131072
cache-type-k         = f16
cache-type-v         = f16
batch-size           = 4096
ubatch-size          = 4096
alias                = deepseek-v4-flash-vision-exp,agent-dsv4
cmoe                 = 1
moe-cache-mib        = 16384
load-mode            = none
no-mmproj            = 1

[qwen3.8-flash-next]
hf                   = ggml-org/Qwen3.8-Flash-Next-GGUF:IQ4_NL
spec-default         = 0
spec-type            = draft-mtp
spec-draft-n-max     = 3
spec-draft-hf        = ggml-org/Qwen3.8-Flash-Next-GGUF
spec-draft-model     = mtp-Qwen3.8-Flash-Next-Q4_0.gguf
ctx-size             = 131072
cache-type-k         = q8_0
cache-type-v         = q8_0
batch-size           = 4096
ubatch-size          = 2048
spec-draft-n-ubatch  = 512
alias                = qwen3.8-flash-next,agent-qwen4
cmoe                 = 1
moe-cache-mib        = 16384
load-mode            = none
lazy-mode            = off
no-mmproj            = 1

[glm5.3-flash]
hf                   = ggml-org/GLM-5.3-Flash-GGUF:Q2_K_S
spec-default         = 0
#spec-type            = draft-mtp
#spec-draft-n-max     = 3
#spec-draft-hf        = ggml-org/GLM-5.3-Flash-GGUF
#spec-draft-model     = mtp-GLM-5.3-Flash-Q4_0.gguf
ctx-size             = 131072
cache-type-k         = q8_0
cache-type-v         = q8_0
batch-size           = 4096
ubatch-size          = 4096
alias                = glm5.3-flash,agent-glm
cmoe                 = 1
moe-cache-mib        = 12288
load-mode            = none
no-mmproj            = 1

# 39.8B MoE (2.5B active), 256 routed experts, no MTP drafter
# Q4_K_M is 23.4GB, 21.3GB of that is routed experts - if VRAM is tight, move them
# to the 128GB of system RAM with: cmoe, moe-cache-mib, load-mode = none
[flint]
hf                   = ggml-org/Flint-GGUF:Q4_K_M
ctx-size             = 262144
cache-type-k         = q8_0
cache-type-v         = q8_0
batch-size           = 2048
ubatch-size          = 2048
alias                = flint,agent-flint
