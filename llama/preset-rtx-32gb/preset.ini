# uses:
# - llama.cpp webui
# - llama.vim
# - pi
#
# target machines with 32GB VRAM:
# - NVIDIA RTX 5090

[*]
ctx-size             = 0
kv-unified           = 1
parallel             = 1
spec-default         = 1
reasoning-preserve   = 1
spec-draft-sampling  = probabilistic

[gpt-oss-20b-hf]
hf                   = ggml-org/gpt-oss-20b-GGUF
ctx-size             = 262144
batch-size           = 2048
ubatch-size          = 2048
top-p                = 1.0
top-k                = 0
min-p                = 0.01
temp                 = 1.0
chat-template-kwargs = {"reasoning_effort": "high"}

[gpt-oss-20b-hf-low]
hf                   = ggml-org/gpt-oss-20b-GGUF
ctx-size             = 262144
batch-size           = 2048
ubatch-size          = 2048
top-p                = 1.0
top-k                = 0
min-p                = 0.01
temp                 = 1.0
chat-template-kwargs = {"reasoning_effort": "low"}

[gpt-oss-20b-hf-medium]
hf                   = ggml-org/gpt-oss-20b-GGUF
ctx-size             = 262144
batch-size           = 2048
ubatch-size          = 2048
top-p                = 1.0
top-k                = 0
min-p                = 0.01
temp                 = 1.0
chat-template-kwargs = {"reasoning_effort": "medium"}

[gpt-oss-20b-hf-high]
hf                   = ggml-org/gpt-oss-20b-GGUF
ctx-size             = 262144
batch-size           = 2048
ubatch-size          = 2048
top-p                = 1.0
top-k                = 0
min-p                = 0.01
temp                 = 1.0
chat-template-kwargs = {"reasoning_effort": "high"}

[qwen2.5-coder-7b-hf-fim]
hf                   = ggml-org/Qwen2.5-Coder-7B-Q8_0-GGUF
ctx-size             = 65536
cache-type-k         = q8_0
cache-type-v         = q8_0
cache-reuse          = 256
batch-size           = 1024
ubatch-size          = 1024
alias                = fim,infill

# uses a dedicated, pure 4-bit drafter
[qwen3.6-35b-a3b-hf-think-mtp]
hf                   = ggml-org/Qwen3.6-35B-A3B-GGUF:Q4_K_M
spec-type            = draft-mtp
spec-draft-n-max     = 3
spec-draft-hf        = ggml-org/Qwen3.6-35B-A3B-GGUF
spec-draft-model     = mtp-Qwen3.6-35B-A3B-Q4_0.gguf
ctx-size             = 262144
cache-type-k         = q8_0
cache-type-v         = q8_0
batch-size           = 2048
ubatch-size          = 512
alias                = qwen3.6-35b-a3b-hf-think-mtp,inst

# uses a dedicated, pure 4-bit drafter
[qwen3.6-27b-hf-think-mtp]
hf                   = ggml-org/Qwen3.6-27B-GGUF:Q4_K_M
spec-type            = draft-mtp
spec-draft-n-max     = 3
spec-draft-hf        = ggml-org/Qwen3.6-27B-GGUF
spec-draft-model     = mtp-Qwen3.6-27B-Q4_0.gguf
ctx-size             = 262144
cache-type-k         = q8_0
cache-type-v         = q8_0
batch-size           = 2048
ubatch-size          = 512
alias                = qwen3.6-27b-hf-think-mtp,agent-qwen3.6
reasoning-budget     = 4096
reasoning-budget-message = ... I am thinking for too long -- let me gather more info about the task.
chat-template-kwargs = {"reasoning_effort": "medium"}

