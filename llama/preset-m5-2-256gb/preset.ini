# uses:
# - llama.cpp webui
# - pi
# - dsh
#
# target machines with 256GB+ unified memory:
# - Mac Studio M5 Ultra (m5-2)

[*]
ctx-size             = 0
kv-unified           = 1
parallel             = 4
#spec-default         = 1
reasoning-preserve   = 1
backend-sampling     = 1
spec-draft-sampling  = probabilistic

[deepseek-v4-flash-vision-ext-hf]
hf                   = ggml-org/DeepSeek-V4-Flash-Vision-Exp-GGUF:MXFP4
spec-type            = draft-dspark
spec-draft-n-max     = 3
spec-draft-hf        = ggml-org/DeepSeek-V4-Flash-Vision-Exp-GGUF
spec-draft-model     = dspark-DeepSeek-V4-Flash-Vision-Exp-MXFP4.gguf
ctx-size             = 524288
parallel             = 2
batch-size           = 2048
ubatch-size          = 2048
top-p                = 0.95
top-k                = 0
temp                 = 1.0
alias                = deepseek-v4-flash-vision-exp-hf,agent-dsv4

[qwen3.8-flash-next-hf]
hf                   = ggml-org/Qwen3.8-Flash-Next-GGUF:IQ4_NL
spec-type            = draft-dflash
spec-draft-n-max     = 3
spec-draft-hf        = ggml-org/Qwen3.8-Flash-Next-GGUF
spec-draft-model     = dflash-Qwen3.8-Flash-Next-Q4_0.gguf
kv-unified           = 0
parallel             = 4
ctx-size             = 1048576
batch-size           = 2048
ubatch-size          = 512
top-p                = 0.95
top-k                = 0
temp                 = 1.0
alias                = qwen3.8-flash-next-hf,agent-qwen4

[glm5.3-flash-hf]
hf                   = ggml-org/GLM-5.3-Flash-GGUF:Q4_K
spec-type            = draft-mtp
spec-draft-n-max     = 3
spec-draft-hf        = ggml-org/GLM-5.3-Flash-GGUF
spec-draft-model     = mtp-GLM-5.3-Flash-Q4_0.gguf
kv-unified           = 0
parallel             = 2
ctx-size             = 524288
batch-size           = 2048
ubatch-size          = 2048
top-p                = 0.95
top-k                = 0
temp                 = 1.0
alias                = glm5.3-flash-hf,agent-glm

[deepseek-v4.1-flash-1017-hf]
hf                   = ggml-org/DeepSeek-V4.1-Flash-1017-GGUF:Q2_K
spec-type            = draft-dspark
spec-draft-n-max     = 5
spec-draft-hf        = ggml-org/DeepSeek-V4.1-Flash-1017-GGUF
spec-draft-model     = dspark-DeepSeek-V4.1-Flash-1017-MXFP4.gguf
kv-unified           = 0
parallel             = 1
ctx-size             = 524288
batch-size           = 4096
ubatch-size          = 512
top-p                = 1.0
top-k                = 0
temp                 = 1.0
alias                = deepseek-v4.1-flash-1017-hf,agent-dsv41

[deepseek-v4.1-flash-1017-s-hf]
hf                   = ggml-org/DeepSeek-V4.1-Flash-1017-GGUF:Q2_K_S
spec-type            = draft-dspark
spec-draft-n-max     = 5
spec-draft-hf        = ggml-org/DeepSeek-V4.1-Flash-1017-GGUF
spec-draft-model     = dspark-DeepSeek-V4.1-Flash-1017-MXFP4.gguf
kv-unified           = 1
parallel             = 2
ctx-size             = 1048576
batch-size           = 4096
ubatch-size          = 1024
top-p                = 1.0
top-k                = 0
temp                 = 1.0
alias                = deepseek-v4.1-flash-1017-s-hf,agent-dsv41-s
