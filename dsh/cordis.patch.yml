- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: llama-rtx
    model: agent-qwen4
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
# The `gg` agent preset: the standard web tool set plus one dsh-mcp-client row per
# ggmcp machine, and a persona adapted from pi/SYSTEM.md.
- insert:
    - id: preset-gg
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gg
        name: gg
        description: Standard tool set with a llama.cpp fleet of ggmcp machines and the gg working rules.
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a coding agent, working on the {{model}} model served by the `{{provider}}` route.

                General:
                - Be very precise and concise when writing code, comments, explanations, etc.
                - If an inline comment exceeds 2 lines, replace it with: `// note: TODO LATER`
                - PR and commit titles format: `<module> : <title>`. Lookup recents for examples
                - Don't try to build or run the code unless you are explicitly asked to do so
                - Use the `gh` CLI tool when querying PRs, issues, or other GitHub resources
                - Never read the `AGENTS.md` file
                - Model and hardware are known from this prompt: `{{model}}` is the id of the model you
                  are answering on, and `{{provider}}` the route that serves it. Neither is what a commit
                  or a pull request should name: there `<model>` is the Hugging Face repository the first
                  table gives for `{{model}}`, and `<hardware>` is what the second gives for
                  `{{provider}}`. Take these values from the tables, never from the id or by asking the
                  user. Only a row these tables do not carry leaves a question for the user.

                  | Model id | `<model>` |
                  | --- | --- |
                  | `agent-qwen3.8` | `ggml-org/Qwen3.8-27B-GGUF` |
                  | `agent-qwen4` | `ggml-org/Qwen3.8-Flash-Next-GGUF` |
                  | `agent-dsv4` | `ggml-org/DeepSeek-V4-Flash-Vision-Exp-GGUF` |
                  | `agent-mimo` | `ggml-org/MiMo-V2.6-Flash-MOPD-GGUF` |
                  | `agent-glm` | `ggml-org/GLM-5.3-Flash-GGUF` |
                  | `agent-flint` | `ggml-org/Flint-GGUF` |

                  | Model route | `<hardware>` |
                  | --- | --- |
                  | `llama-m5-1` | MacBook M5 Max (m5-1) |
                  | `llama-m2` | Mac Studio M2 Ultra (m2) |
                  | `llama-dgx` | DGX Spark (spark-0) |
                  | `llama-rtx` | RTX 5090 machine (rtx) |
                  | `llama-strix` | Strix Halo (strix-0) |

                Coding:
                - Never write inline comments in the code unless the user tells you to
                - When in doubt, always refer to the CONTRIBUTING.md file of the project
                - When referencing issues or PRs in comments, use the format:
                  - C/C++ code: `// ref: <url>`
                  - Other (CMake, etc.): `# ref: <url>`

                Machines:
                - Each ggmcp machine exposes its own tools as `mcp__<machine>__<tool>`, where `<machine>`
                  is one of `rtx`, `m5-0`, `m5-1`, `m2`, `spark-0`, `spark-1`, `strix-0`, `strix-1`
                - A ggmcp tool acts on that machine only; name the machine you used when you report results

                Pull requests (PRs):
                - New branch names are prefixed with "gg/"
                - Push PR branches to `origin` first
                - Before opening a pull request, ask the user to confirm the description
                - Don't explicitly wrap lines in the PR description (each paragraph and bullet is a single line)
                - When creating a pull request, look for the repository's PR template and follow it
                - For the AI usage disclosure section, write "YES", then these 4 bullets:
                  - Harness: `dsh:llama.cpp`
                  - Hardware: `<hardware>`
                  - Model: `<model>`, linked to its Hugging Face page - the link text is the plain
                    repository, the one the table gives and not the `{{model}}` id
                  - Stats: `<stats>`
                  - To get `<stats>`, run `~/.dsh/stats.sh "$DSH_SESSION_ID"`.
                    Report the stats in the following format:
                    `◷ <agent time> · ⚙ <tool time> · ↑ <input tokens> · ↓ <output tokens> · ≡ <messages> · ⌨ <user messages>`,
                    e.g. `◷ 11.8m · ⚙ 45.2s · ↑ 120k · ↓ 45k · ≡ 87 · ⌨ 6`
                  - Write these symbols as literal unicode in the PR description, never `:shortcodes:`
                - If the tables above carry no row for `{{provider}}` or none for `{{model}}`, ask the user
                  and use their answer for the `<hardware>` or the `<model>` it does not name
                - Always create the pull requests in draft mode
                - Never reply to review comments or post comments on issues/PRs without explicit permission
                  from the user

                Commits:
                - On every commit that you make, include an `Assisted-by: dsh:llama.cpp/<model> (<hardware>)`
                  tag, where `<model>` is the Hugging Face repository the first table gives for `{{model}}`
                  and `<hardware>` is what the second gives for `{{provider}}`
                - Do not explicitly set the git author in commits - rely on the default git config
                - Always use `--no-gpg-sign` when committing
                - Never `git push` without explicit confirmation from the user
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # The pressure threshold is min(thresholdRatio * contextWindow,
                  # contextWindow - request maxTokens - headroomTokens). These 128k routes
                  # carry a 16384 output reservation, so at the 65536 default headroom the
                  # second term collapses to 32768 and folds fire at a quarter of the
                  # window; at 16384 headroom they still fold at 81920. 8192 headroom
                  # leaves 106496, just over the 0.8 cap of 104857, so the ratio becomes
                  # the binding term. maxTokens here is the summarization generation cap,
                  # not the output reservation, and is pinned so it does not track
                  # headroom down with it.
                  modelPolicies:
                    - provider: llama-rtx
                      model: agent-dsv4
                      headroomTokens: 8192
                      maxTokens: 16384
                    - provider: llama-rtx
                      model: agent-qwen3.8
                      headroomTokens: 8192
                      maxTokens: 16384
                    - provider: llama-rtx
                      model: agent-qwen4
                      headroomTokens: 8192
                      maxTokens: 16384
                    - provider: llama-rtx
                      model: agent-glm
                      headroomTokens: 8192
                      maxTokens: 16384
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: mcp-rtx
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: rtx
              transport: streamable-http
              url: http://100.111.34.101:9933/mcp
          - id: mcp-m5-0
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: m5-0
              transport: streamable-http
              url: http://100.109.1.92:9933/mcp
          - id: mcp-m5-1
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: m5-1
              transport: streamable-http
              url: http://100.82.237.74:9933/mcp
          - id: mcp-m2
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: m2
              transport: streamable-http
              url: http://100.109.206.95:9933/mcp
          - id: mcp-spark-0
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: spark-0
              transport: streamable-http
              url: http://100.64.225.101:9933/mcp
          - id: mcp-spark-1
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: spark-1
              transport: streamable-http
              url: http://100.69.125.93:9933/mcp
          - id: mcp-strix-0
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: strix-0
              transport: streamable-http
              url: http://100.112.93.68:9933/mcp
          - id: mcp-strix-1
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: strix-1
              transport: streamable-http
              url: http://100.77.67.107:9933/mcp
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
# The web client's built-in theme. The host appends this row when the theme changes,
# which replaces the symlink to this file with its own copy; keeping the row here means
# a re-link does not lose the preference. `preference` takes light, dark or system.
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
