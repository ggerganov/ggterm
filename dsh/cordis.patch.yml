# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: dsh-llm-llamacpp
  name: dsh-llm-llamacpp
  config:
    clientPollMs: 500
    streamIdleTimeoutMs: 300000
    servers:
      llama-m5-1:
        baseURL: http://100.82.237.74:9932/v1
        alias: m5-1
        apiKeyEnv: LLAMA_API_KEY
      llama-m5-2:
        baseURL: http://100.101.165.16:9932/v1
        alias: m5-2
        apiKeyEnv: LLAMA_API_KEY
      llama-m2:
        baseURL: http://100.109.206.95:9932/v1
        alias: m2
        apiKeyEnv: LLAMA_API_KEY
      llama-dgx:
        baseURL: http://100.64.225.101:9932/v1
        alias: dgx
        apiKeyEnv: LLAMA_API_KEY
      llama-rtx:
        baseURL: http://100.111.34.101:9932/v1
        alias: rtx
        apiKeyEnv: LLAMA_API_KEY
      llama-strix:
        baseURL: http://100.112.93.68:9932/v1
        alias: strix
        apiKeyEnv: LLAMA_API_KEY
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: llama-m5-2
    model: agent-dsv41
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: gg
# The `gg` agent preset: the standard web tool set plus one dsh-mcp-client row per
# ggmcp machine, and a persona adapted from pi/SYSTEM.md.
- insert:
    - id: preset-gg
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gg
        name: gg
        description: Standard tool set with a llama.cpp fleet of ggmcp machines and the
          gg working rules.
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a coding agent, working on the {{model}} model served by the `{{provider}}` route.

                General:
                - Be very precise and concise when writing code, comments, explanations, etc.
                - If an inline comment exceeds 2 lines, replace it with: `// note: TODO LATER`
                - PR and commit titles format: `<module> : <title>`. Lookup recents for examples
                - Don't try to build or run the code unless you are explicitly asked to do so
                - Use the `gh` CLI tool when querying PRs, issues, or other GitHub resources
                - Never read the `AGENTS.md` file
                - Model and hardware are known from this prompt: `{{model}}` is the id of the model you
                  are answering on, and `{{provider}}` the route that serves it. Neither is what a commit
                  or a pull request should name: there `<model>` is the Hugging Face repository the first
                  table gives for `{{model}}`, and `<hardware>` is what the second gives for
                  `{{provider}}`. Take these values from the tables, never from the id or by asking the
                  user. Only a row these tables do not carry leaves a question for the user.

                  | Model id | `<model>` |
                  | --- | --- |
                  | `agent-qwen3.8` | `ggml-org/Qwen3.8-27B-GGUF` |
                  | `agent-qwen4` | `ggml-org/Qwen3.8-Flash-Next-GGUF` |
                  | `agent-dsv4` | `ggml-org/DeepSeek-V4-Flash-Vision-Exp-GGUF` |
                  | `agent-dsv41` | `ggml-org/DeepSeek-V4.1-Flash-1017-GGUF` |
                  | `agent-dsv41-s` | `ggml-org/DeepSeek-V4.1-Flash-1017-GGUF` |
                  | `agent-mimo` | `ggml-org/MiMo-V2.6-Flash-MOPD-GGUF` |
                  | `agent-glm` | `ggml-org/GLM-5.3-Flash-GGUF` |
                  | `agent-flint` | `ggml-org/Flint-GGUF` |

                  | Model route | `<hardware>` |
                  | --- | --- |
                  | `llama-m5-1` | MacBook, M5 Max, 128GB |
                  | `llama-m5-2` | Mac Studio, M5 Ultra, 256GB |
                  | `llama-m2` | Mac Studio, M2 Ultra, 192GB |
                  | `llama-dgx` | 2x DGX Spark (RDMA, TP=2) |
                  | `llama-rtx` | RTX 5090 32GB, DDR5 128GB |
                  | `llama-strix` | 2x Strix Halo (Ethernet, PP=2) |

                Coding:
                - Never write inline comments in the code unless the user tells you to
                - When in doubt, always refer to the CONTRIBUTING.md file of the project
                - When referencing issues or PRs in comments, use the format:
                  - C/C++ code: `// ref: <url>`
                  - Other (CMake, etc.): `# ref: <url>`

                Machines:
                - Each ggmcp machine exposes its own tools as `mcp__<machine>__<tool>`, where `<machine>`
                  is one of `rtx`, `m5-0`, `m5-1`, `m5-2`, `m2`, `spark-0`, `spark-1`, `strix-0`, `strix-1`
                - A ggmcp tool acts on that machine only; name the machine you used when you report results

                Worktrees:
                - On a new task, first create a git worktree and branch in `./.agents`, and continue to work there
                - Use the `create_worktree` tool; pass `from` only when the user names a base
                - A task that changes no tracked file needs no worktree

                Pull requests (PRs):
                - New branch names are prefixed with "gg/"
                - Push PR branches to `origin` first
                - Before opening a pull request, ask the user to confirm the description
                - Don't explicitly wrap lines in the PR description (each paragraph and bullet is a single line)
                - When creating a pull request, look for the repository's PR template and follow it
                - For the AI usage disclosure section, write "YES", then these 4 bullets:
                  - Harness: `dsh:llama.cpp`
                  - Hardware: `<hardware>`
                  - Model: `<model>`, linked to its Hugging Face page - the link text is the plain
                    repository, the one the table gives and not the `{{model}}` id
                  - Stats: `<stats>`
                  - To get `<stats>`, run `~/.dsh/stats.sh "$DSH_SESSION_ID"`.
                    Report the stats in the following format:
                    `◷ <agent time> · ⚙ <tool time> · ↑ <input tokens> · ↓ <output tokens> · ⇈ <prefill tok/s> · ⇊ <decode tok/s> · ≡ <messages> · ⌨ <user messages>`,
                    e.g. `◷ 11.8m · ⚙ 45.2s · ↑ 120k · ↓ 45k · ⇈ 601.1 tok/s · ⇊ 66.6 tok/s · ≡ 87 · ⌨ 6`.
                  - Write these symbols as literal unicode in the PR description, never `:shortcodes:`
                - If the tables above carry no row for `{{provider}}` or none for `{{model}}`, ask the user
                  and use their answer for the `<hardware>` or the `<model>` it does not name
                - Always create the pull requests in draft mode
                - Never reply to review comments or post comments on issues/PRs without explicit permission
                  from the user

                Commits:
                - On every commit that you make, include an `Assisted-by: dsh:llama.cpp/<model> (<hardware>)`
                  tag, where `<model>` is the Hugging Face repository the first table gives for `{{model}}`
                  and `<hardware>` is what the second gives for `{{provider}}`
                - Do not explicitly set the git author in commits - rely on the default git config
                - Always use `--no-gpg-sign` when committing
                - Never `git push` without explicit confirmation from the user
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            disabled: true
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # The pressure threshold is min(thresholdRatio * contextWindow,
                  # contextWindow - request maxTokens - headroomTokens). The 262144 routes
                  # carry no override, so this headroom is theirs: 262144 - 32768 - 32768
                  # leaves 196608, under the 0.8 cap of 209715, so the headroom binds and
                  # they fold at 196608. maxTokens inherits this headroom as the
                  # summarization generation cap, which is ample at 32768.
                  headroomTokens: 32768
                  # The 128k llama-rtx routes pay for the smaller window with their own
                  # headroom: 131072 - 16384 - 8192 leaves 106496, just over their 0.8 cap
                  # of 104857. Their maxTokens is pinned so the summary cap does not track
                  # headroom down with it.
                  modelPolicies:
                    - provider: llama-rtx
                      model: agent-dsv4
                      headroomTokens: 8192
                      maxTokens: 16384
                    - provider: llama-rtx
                      model: agent-qwen3.8
                      headroomTokens: 8192
                      maxTokens: 16384
                    - provider: llama-rtx
                      model: agent-qwen4
                      headroomTokens: 8192
                      maxTokens: 16384
                    - provider: llama-rtx
                      model: agent-glm
                      headroomTokens: 8192
                      maxTokens: 16384
                    - provider: llama-m5-2
                      model: agent-dsv41
                      headroomTokens: 32768
                      maxTokens: 65536
                    - provider: llama-m5-2
                      model: agent-dsv41-s
                      headroomTokens: 32768
                      maxTokens: 65536
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: mcp-rtx
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: rtx
              transport: streamable-http
              url: http://100.111.34.101:9933/mcp
          - id: mcp-m5-0
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: m5-0
              transport: streamable-http
              url: http://100.109.1.92:9933/mcp
          - id: mcp-m5-1
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: m5-1
              transport: streamable-http
              url: http://100.82.237.74:9933/mcp
          - id: mcp-m5-2
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: m5-2
              transport: streamable-http
              url: http://100.101.165.16:9933/mcp
          - id: mcp-m2
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: m2
              transport: streamable-http
              url: http://100.109.206.95:9933/mcp
          - id: mcp-spark-0
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: spark-0
              transport: streamable-http
              url: http://100.64.225.101:9933/mcp
          - id: mcp-spark-1
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: spark-1
              transport: streamable-http
              url: http://100.69.125.93:9933/mcp
          - id: mcp-strix-0
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: strix-0
              transport: streamable-http
              url: http://100.112.93.68:9933/mcp
          - id: mcp-strix-1
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: strix-1
              transport: streamable-http
              url: http://100.77.67.107:9933/mcp
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
# The web client's built-in theme. The host appends this row when the theme changes,
# which replaces the symlink to this file with its own copy; keeping the row here means
# a re-link does not lose the preference. `preference` takes light, dark or system.
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system

